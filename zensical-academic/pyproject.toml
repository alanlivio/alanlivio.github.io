[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zensical-academic"
version = "0.1.0"
description = "Reusable academic page templates and theme for Zensical static site generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "jinja2",
    "pyyaml",
]

[project.entry-points."mkdocs.themes"]
academic = "zensical_academic"
zensical-academic = "zensical_academic"

[tool.setuptools.packages.find]
where = ["."]
include = ["zensical_academic*"]

[tool.setuptools.package-data]
zensical_academic = ["*.html", "**/*.html", "mkdocs_theme.yml"]
