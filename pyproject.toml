[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher-cv-website"
version = "0.1.0"
description = "Personal researcher CV website generated with Zensical"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "zensical",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[project.entry-points."mkdocs.themes"]
academic = "zensical_academic"
zensical-academic = "zensical_academic"

[tool.setuptools.packages.find]
where = ["zensical-academic"]
include = ["zensical_academic*"]

[tool.setuptools.package-data]
zensical_academic = ["*.html", "**/*.html", "css/*.css", "js/*.js", "mkdocs_theme.yml"]


[tool.pytest.ini_options]
testpaths = ["tests", "zensical-academic/tests"]
pythonpath = ["zensical-academic", "."]
addopts = "--import-mode=importlib"
