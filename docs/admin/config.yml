backend:
  name: github
  repo: alanlivio/alanlivio.github.io
  branch: main
  commit_messages:
    create: 'create {{collection}} "{{slug}}"'
    update: 'update {{collection}} "{{slug}}"'
    delete: 'delete {{collection}} "{{slug}}"'
    uploadMedia: 'upload "{{path}}"'
    deleteMedia: 'delete "{{path}}"'

local_backend: true

media_folder: docs/assets
public_folder: /assets

collections:
  - name: config
    label: Site Profile & Config
    files:
      - name: profile
        label: Researcher Profile
        file: zensical.toml
        format: toml
        fields:
          - name: project
            label: Project Settings
            widget: object
            fields:
              - { label: "Site Name", name: "site_name", widget: "string" }
              - { label: "Site URL", name: "site_url", widget: "string" }
              - { label: "Site Author", name: "site_author", widget: "string" }
              - { label: "Site Description", name: "site_description", widget: "string" }
              - name: extra
                label: Researcher Info
                widget: object
                fields:
                  - name: researcher
                    label: Researcher Details
                    widget: object
                    fields:
                      - { label: "Researcher Name", name: "name", widget: "string" }
                      - { label: "Role", name: "role", widget: "string" }
                      - { label: "CV File", name: "cv_file", widget: "string" }
                      - { label: "Photo URL", name: "photo", widget: "string" }
                      - { label: "Interests", name: "interests", widget: "list" }
                      - { label: "Applications", name: "applications", widget: "list" }
                      - { label: "Short Bio", name: "shortbio", widget: "text" }

  - name: blog
    label: Blog Posts
    folder: docs/blog
    create: true
    slug: "{{title}}"
    path: "{{year}}/{{slug}}/index"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: tips
    label: Tips
    folder: docs/tips
    create: true
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: projects_active
    label: Active Projects
    folder: docs/projects_active
    create: true
    nested:
      depth: 2
    path: "{{route}}/index"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Body", name: "body", widget: "markdown" }
