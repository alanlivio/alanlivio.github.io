    "Graph-Based Machine Learning",
]
applications = [
    "Digital Humanities",
    "Climate and Nature",
    "Trustworthy AI",
    "TV Systems",
]
shortbio = "I am Computer Science Lecturer since 2024 at University of Reading. Previously, I was a postdoc at University College London (UCL) in 2021, working on immersive media. I completed my PhD in 2017 and worked as postdoc both at PUC-Rio (Brazil), contributing to Media Industry standards (ITU-T SG16, SBTVD) and working on video understanding. Since my PhD, I am an active member on events related to the ACM SIG-Multimedia community (ACM MM, MMSys, IMX, QoMex, WebMedia). My research interests lie on Artificial Intelligence (AI), Computer Vision, and GenAI methods. At UoR, I am applying such AI in multidisciplinary research in Digital Humanities (collaboration with MERL, Ure, Synthetic Media), climate (Meteorology) and biodiversity (collaboration with National History Museum).<br><br>Note: I am actively looking for students to work with. Please access my list of proposed projects (UG, MSc, PhD) at https://alanlivio.github.io/projects and contact me at a.guedes@reading.ac.uk."
clipping = [
    "https://www.rnp.br/en/rnp-and-microsoft-challenge-artificial-intelligence",
    "http://www.inf.puc-rio.br/blog/noticia/noticia/pesquisadores-do-telemidia-lab-publicam-artigo-sobre-nova-versao-do-ginga",
