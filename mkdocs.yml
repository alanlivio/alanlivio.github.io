# -- mkdocs

site_name: Alan Guedes
site_url: http://alanlivio.github.io/
site_author: Alan Guedes
site_description: Alan Guedes website
copyright: MIT
remote_branch: gh-pages
repo_url: https://github.com/alanlivio/
edit_uri: edit/master/mkdocs/
docs_dir: "mkdocs"
plugins:
  - search
  - tags
  - macros
  - glightbox
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_css:
  - extra.css

# -- mkdocs material

nav:
  - index.md
  - PhDs Openings:
      - phd-projects/cv-polinators/index.md
      - phd-projects/llm-forecast/index.md
  - Active PhDs:
      - phd-projects/bio-graphs/index.md
  - "Software":
      - "Computer Vision":
          - software/predict360user/index.md
      - "ITU H.761 Ginga":
          - software/ginga.md
          - software/ncl-blocks.md
          - software/brasil4d/index.md
      - "Academic":
          - software/autograder-gen.md
          - software/docxreviews2txt.md
          - software/researcher-website-cv.md
      - "Developer":
          - software/ps-sh-helpers.md
  - "Tips":
      - tips/for-developers.md
      - tips/for-phds.md

theme:
  name: material
  icon:
    logo: fontawesome/solid/code
  favicon: fontawesome/solid/code
  locale: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  nav_style: dark
  features:
    - navigation.expand
    - navigation.tabs
    - navigation.sections
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest

