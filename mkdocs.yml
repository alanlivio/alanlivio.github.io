    shortbio: >
      I am a Computer Science Lecturer at the University of Reading (UoR). My research interest lies in Computer Vision, Graphs and GenAI methods. I have a strong practical sense and enjoy working on multidisciplinary projects. At UoR, I am involved in: 'Heritage & Creativity' research using GenAI for the virtual reconstruction of heritage objects and the generation of synthetic avatars; and 'Climate and Nature' research to visual understand climate data, precision agriculture, and biodiversity conservation. I am an active member of ACM SIG-Multimedia communities (MM, MMSys, IMX, QoMex, WebMedia). Previously, I was a postdoc at University College London (UCL), UK, working on immersive media, and I completed my PhD at PUC-Rio (Brazil), contributing to Media Industry standards (ITU-T SG16, SBTVD).
    clipping:
